<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Dbuggs Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'DM Sans', sans-serif; background: #EFF1F8; min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
}
.box {
  background: #fff; border-radius: 12px; padding: 36px; width: 360px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.08);
}
.brand { font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700; color: #1C2B6B; margin-bottom: 4px; }
.brand span { color: #F07830; }
.sub { font-size: 13px; color: #6B7280; margin-bottom: 24px; }
label { font-size: 12.5px; font-weight: 600; color: #374151; display: block; margin-bottom: 6px; }
input {
  width: 100%; padding: 10px 12px; border: 1px solid #E5E7EB; border-radius: 8px;
  font-size: 14px; margin-bottom: 16px; font-family: inherit;
}
button {
  width: 100%; padding: 11px; background: #F07830; color: #fff; border: none;
  border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer;
}
button:hover { background: #d9631f; }
button:disabled { opacity: 0.6; cursor: not-allowed; }
.msg { font-size: 12.5px; margin-top: 4px; color: #991B1B; min-height: 16px; }
.hint { font-size: 11.5px; color: #9CA3AF; margin-top: 16px; line-height: 1.5; }
</style>
</head>
<body>
<div class="box">
  <div class="brand">d<span>bugg</span>s</div>
  <div class="sub">Login — All Accounts</div>

  <form id="login-form" onsubmit="doLogin(event)">
    <label>Email</label>
    <input type="email" id="email" value="admin@dbuggs.in" required>
    <label>Password</label>
    <input type="password" id="password" value="admin123" required>
    <button type="submit">Login</button>
  </form>

  <div class="msg" id="msg"></div>
  <div class="hint">
    Super Admin: admin@dbuggs.in / admin123<br>
    Admin: manageradmin@dbuggs.in / admin123<br>
    B2C: b2c@dbuggs.in / user123<br>
    B2B: b2b@dbuggs.in / user123
  </div>
</div>

<script>
const API_BASE = 'http://localhost:4000';

async function doLogin(e) {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const msg = document.getElementById('msg');
  msg.style.color = '#6B7280';
  msg.textContent = 'Logging in...';
  try {
    const res = await fetch(`${API_BASE}/auth/login`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    if (!res.ok) { const e2 = await res.json().catch(() => ({})); throw new Error(e2.message || 'Login failed'); }
    const data = await res.json();
    localStorage.setItem('dbugg_admin_token', data.accessToken);
    localStorage.setItem('dbugg_user_role', data.user.role);
    localStorage.setItem('dbugg_user_name', data.user.name || data.user.email);
    if (['admin', 'super_admin'].includes(data.user.role)) {
      window.location.href = '/admin-pages/dashboard.html';
    } else {
      window.location.href = '/account.html';
    }
  } catch (e) {
    msg.style.color = '#991B1B';
    msg.textContent = e.message;
  }
}
</script>
</body>
</html>
