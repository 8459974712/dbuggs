<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart — dbuggs</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#1C2B6B;--accent:#F07830;--accent-hover:#d9631f;--bg:#F7F8FC;--card:#fff;--border:#E5E7EB;--text:#111827;--text-sec:#6B7280;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);}
h1,h2,h3{font-family:'Space Grotesk',sans-serif;}
a{text-decoration:none;color:inherit;}
.topbar{background:var(--navy);padding:14px 28px;display:flex;align-items:center;gap:24px;}
.brand{font-family:'Space Grotesk',sans-serif;font-size:21px;font-weight:700;color:#fff;}
.brand span{color:var(--accent);}
.back-link{color:rgba(255,255,255,0.8);font-size:13px;}
.container{max-width:700px;margin:30px auto;padding:0 20px;}
h2{margin-bottom:18px;}
.item{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.item-name{font-weight:600;font-size:14.5px;}
.item-sub{font-size:11.5px;color:var(--text-sec);font-family:monospace;}
.item-price{font-weight:700;color:var(--navy);}
.remove-btn{background:none;border:none;color:#991B1B;font-size:12.5px;cursor:pointer;margin-left:14px;}
.summary{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px;margin-top:20px;}
.row{display:flex;justify-content:space-between;font-size:14px;padding:6px 0;}
.row.total{font-weight:700;font-size:17px;border-top:1px solid var(--border);margin-top:8px;padding-top:12px;}
.form-field{margin-top:14px;}
label{font-size:12.5px;font-weight:600;display:block;margin-bottom:6px;}
input,select{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;}
.btn{width:100%;padding:13px;border-radius:9px;font-weight:700;font-size:14.5px;border:none;cursor:pointer;margin-top:16px;background:var(--accent);color:#fff;}
.btn:hover{background:var(--accent-hover);}
.empty{text-align:center;padding:50px 20px;color:var(--text-sec);}
.msg{font-size:13px;margin-top:10px;text-align:center;}
</style>
</head>
<body>
<div class="topbar">
  <a href="/index.html" class="brand">d<span>bugg</span>s</a>
  <a href="/index.html" class="back-link">← Continue shopping</a>
</div>
<div class="container">
  <h2>Your Cart</h2>
  <div id="cart-items"></div>
  <div id="summary-section"></div>
</div>

<script src="shop-api.js"></script>
<script>
function render() {
  const cart = getCart();
  const itemsEl = document.getElementById('cart-items');
  const summaryEl = document.getElementById('summary-section');

  if (cart.length === 0) {
    itemsEl.innerHTML = '<div class="empty">Your cart is empty. <a href="/index.html" style="color:var(--accent);font-weight:600;">Browse laptops →</a></div>';
    summaryEl.innerHTML = '';
    return;
  }

  itemsEl.innerHTML = cart.map(i => `
    <div class="item">
      <div>
        <div class="item-name">${i.brand} ${i.model} ${i.grade ? '— Grade ' + i.grade : ''}</div>
        <div class="item-sub">${i.serialNo}</div>
      </div>
      <div style="display:flex;align-items:center;">
        <div class="item-price">${money(i.sellingPrice)}</div>
        <button class="remove-btn" onclick="removeFromCart('${i.id}'); render(); showDiscountPreview();">Remove</button>
      </div>
    </div>
  `).join('');

  const total = cart.reduce((s, i) => s + Number(i.sellingPrice || 0), 0);
  const user = getUser();

  summaryEl.innerHTML = `
    <div class="summary">
      <div class="row"><span>Subtotal (${cart.length} item${cart.length > 1 ? 's' : ''})</span><span>${money(total)}</span></div>
      <div id="discount-row"></div>
      <div class="row total" id="total-row"><span>Total</span><span>${money(total)}</span></div>
      ${user ? `
        <div class="form-field">
          <label>Shipping Address</label>
          <input type="text" id="address" placeholder="Flat/House no, street, city, pincode">
        </div>
        <button class="btn" onclick="checkout()">Place Order</button>
      ` : `
        <button class="btn" onclick="window.location.href='/login.html'">Login to Checkout</button>
      `}
      <div class="msg" id="msg"></div>
    </div>
  `;
}

async function getB2bDiscount(qty) {
  const user = getUser();
  if (!user || user.role !== 'b2b') return 0;
  try {
    const profile = await apiFetch('/b2b/my');
    if (!profile || !profile.isApproved) return 0;
    const slabs = await apiFetch('/b2b/slabs');
    const slab = slabs.find(s => qty >= s.minQty && qty <= s.maxQty);
    return slab ? slab.discountPercent : 0;
  } catch { return 0; }
}

async function checkout() {
  const cart = getCart();
  const address = document.getElementById('address').value.trim();
  const msg = document.getElementById('msg');
  if (!address) { msg.style.color = '#991B1B'; msg.textContent = 'Please enter a shipping address.'; return; }
  msg.style.color = '#6B7280';
  msg.textContent = 'Placing order...';
  try {
    const discount = await getB2bDiscount(cart.length);
    const orderType = discount > 0 ? 'b2b' : 'b2c';
    for (const item of cart) {
      const amount = Math.round(Number(item.sellingPrice) * (1 - discount / 100));
      await apiFetch('/orders', {
        method: 'POST',
        body: { laptopId: item.id, type: orderType, amount, shippingAddress: address },
      });
    }
    clearCart();
    msg.style.color = '#065F46';
    msg.textContent = discount > 0
      ? `Order placed with ${discount}% wholesale discount! Redirecting...`
      : 'Order placed successfully! Redirecting...';
    setTimeout(() => window.location.href = '/orders.html', 1200);
  } catch (e) {
    msg.style.color = '#991B1B';
    msg.textContent = 'Error: ' + e.message;
  }
}

async function showDiscountPreview() {
  const cart = getCart();
  if (cart.length === 0) return;
  const discount = await getB2bDiscount(cart.length);
  if (discount > 0) {
    const total = cart.reduce((s, i) => s + Number(i.sellingPrice || 0), 0);
    const discounted = Math.round(total * (1 - discount / 100));
    document.getElementById('discount-row').innerHTML = `<div class="row" style="color:#065F46;"><span>Wholesale discount (${discount}%)</span><span>-${money(total - discounted)}</span></div>`;
    document.getElementById('total-row').innerHTML = `<span>Total</span><span>${money(discounted)}</span>`;
  }
}

render();
showDiscountPreview();
</script>
</body>
</html>
