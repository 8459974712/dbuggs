<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inventory - Dealer Portal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#f5f7fa;color:#1a1a2e;min-height:100vh}
.topbar{background:#1a1a2e;color:#fff;padding:12px 24px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.topbar h1{font-size:18px;font-weight:700}
.topbar-right{display:flex;align-items:center;gap:12px}
.topbar-right a{color:#94a3b8;text-decoration:none;font-size:13px}.topbar-right a:hover{color:#fff}
.nav{background:#fff;border-bottom:1px solid #e2e8f0;padding:0 24px;display:flex;gap:0;overflow-x:auto}
.nav a{padding:12px 16px;color:#64748b;text-decoration:none;font-size:13px;font-weight:500;white-space:nowrap;border-bottom:2px solid transparent}
.nav a:hover{color:#1a1a2e}.nav a.active{color:#7c3aed;border-bottom-color:#7c3aed}
.container{max-width:1100px;margin:0 auto;padding:24px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px}
@media(max-width:600px){.stats{grid-template-columns:1fr}}
.stat-card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.06);text-align:center}
.stat-card .value{font-size:32px;font-weight:700}.stat-card .label{font-size:12px;color:#64748b;text-transform:uppercase;margin-top:4px}
.stat-card.green .value{color:#166534}.stat-card.red .value{color:#dc2626}.stat-card.blue .value{color:#7c3aed}
.card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:8px 12px;background:#f8fafc;color:#64748b;font-weight:500;font-size:11px;text-transform:uppercase}
td{padding:10px 12px;border-top:1px solid #f1f5f9}
.badge-green{background:#dcfce7;color:#166534;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:500;display:inline-block}
.badge-blue{background:#dbeafe;color:#1e40af;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:500;display:inline-block}
.empty{text-align:center;color:#94a3b8;padding:32px;font-size:14px}
</style>
</head>
<body>
<div class="topbar"><h1>Dbuggs Dealer</h1><div class="topbar-right"><a href="/">Shop</a><a href="#" onclick="logout()">Logout</a></div></div>
<nav class="nav">
  <a href="dealer-dashboard.html">Dashboard</a>
  <a href="dealer-stock-orders.html">Stock Orders</a>
  <a href="dealer-inventory.html" class="active">Inventory</a>
  <a href="dealer-sales.html">Sales</a>
  <a href="dealer-leads.html">Leads</a>
  <a href="dealer-leaderboard.html">Leaderboard</a>
</nav>
<div class="container">
  <div class="stats">
    <div class="stat-card blue"><div class="value" id="totalCount">0</div><div class="label">Total Units</div></div>
    <div class="stat-card green"><div class="value" id="inStockCount">0</div><div class="label">In Stock</div></div>
    <div class="stat-card red"><div class="value" id="soldCount">0</div><div class="label">Sold</div></div>
  </div>
  <div class="card">
    <h3 style="font-size:15px;font-weight:600;margin-bottom:12px">Inventory Items</h3>
    <div id="itemsList"><div class="empty">Loading...</div></div>
  </div>
</div>
<script>
const API = window.location.hostname==='localhost'?'http://localhost:4000':'http://200.234.39.146:4000';
function getToken(){return localStorage.getItem('dbugg_shop_token')}
function logout(){localStorage.removeItem('dbugg_shop_token');window.location.href='/login.html'}
async function load(){
  if(!getToken()){window.location.href='/login.html';return}
  const r=await fetch(API+'/dealer/inventory',{headers:{'Authorization':'Bearer '+getToken()}});
  if(r.status===401){logout();return}
  const d=await r.json();
  document.getElementById('totalCount').textContent=d.total||0;
  document.getElementById('inStockCount').textContent=d.inStock||0;
  document.getElementById('soldCount').textContent=d.sold||0;
  const items=d.items||[];
  if(!items.length){document.getElementById('itemsList').innerHTML='<div class="empty">No inventory items. Order stock to get started.</div>';return}
  document.getElementById('itemsList').innerHTML='<table><thead><tr><th>Brand</th><th>Model</th><th>Dealer Price</th><th>Status</th></tr></thead><tbody>'+
    items.map(i=>`<tr><td>${i.brand}</td><td>${i.model}</td><td>₹${Number(i.dealerPrice).toLocaleString('en-IN')}</td><td>${i.sold?'<span class="badge-green">Sold</span>':'<span class="badge-blue">In Stock</span>'}</td></tr>`).join('')+
    '</tbody></table>';
}
load();
</script>
</body>
</html>
