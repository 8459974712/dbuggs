<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account — dbuggs</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#1C2B6B;--accent:#F07830;--bg:#F7F8FC;--card:#fff;--border:#E5E7EB;--text:#111827;--text-sec:#6B7280;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);}
h1,h2,h3{font-family:'Space Grotesk',sans-serif;}
a{text-decoration:none;color:inherit;}
.topbar{background:var(--navy);padding:14px 28px;display:flex;align-items:center;gap:24px;justify-content:space-between;}
.brand{font-family:'Space Grotesk',sans-serif;font-size:21px;font-weight:700;color:#fff;}
.brand span{color:var(--accent);}
.logout-btn{background:rgba(255,255,255,0.1);color:#fff;border:1px solid rgba(255,255,255,0.2);padding:7px 16px;border-radius:8px;font-size:13px;cursor:pointer;}
.container{max-width:480px;margin:40px auto;padding:0 20px;}
.card{background:var(--card);border-radius:12px;padding:28px;box-shadow:0 4px 24px rgba(0,0,0,0.06);}
.role-badge{display:inline-block;background:#E0E4F5;color:var(--navy);font-size:12px;font-weight:700;padding:4px 12px;border-radius:20px;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:16px;}
.field{padding:12px 0;border-bottom:1px solid #F3F4F6;}
.field-label{font-size:11.5px;font-weight:600;color:#9CA3AF;text-transform:uppercase;letter-spacing:0.04em;}
.field-value{font-size:14.5px;font-weight:500;margin-top:3px;}
.links{margin-top:20px;display:flex;gap:10px;}
.links a{flex:1;text-align:center;padding:10px;border-radius:8px;border:1px solid var(--border);font-size:13.5px;font-weight:600;}
</style>
</head>
<body>
<div class="topbar">
  <a href="/index.html" class="brand">d<span>bugg</span>s</a>
  <button class="logout-btn" onclick="logout()">Logout</button>
</div>
<div class="container">
  <div class="card">
    <div class="role-badge" id="role-badge">—</div>
    <h2 id="name">Loading...</h2>
    <div style="font-size:13px;color:var(--text-sec);margin-bottom:16px;" id="email-sub">—</div>
    <div class="field"><div class="field-label">Phone</div><div class="field-value" id="phone">—</div></div>
    <div class="field"><div class="field-label">KYC Status</div><div class="field-value" id="kyc">—</div></div>
    <div class="links" id="role-links">
      <a href="/orders.html">My Orders</a>
      <a href="/index.html">Shop</a>
    </div>
  </div>
</div>

<script src="shop-api.js"></script>
<script>
if (!getToken()) window.location.href = '/login.html';

async function loadProfile() {
  try {
    const user = await apiFetch('/users/me');
    document.getElementById('role-badge').textContent = user.role;
    document.getElementById('name').textContent = user.name || 'Unnamed User';
    document.getElementById('email-sub').textContent = user.email || '';
    document.getElementById('phone').textContent = user.phone || '—';
    document.getElementById('kyc').textContent = user.kycStatus || '—';
    if (user.role === 'b2b') {
      document.getElementById('role-links').innerHTML += '<a href="/b2b-register.html">B2B Status</a>';
    } else if (user.role === 'dealer') {
      document.getElementById('role-links').innerHTML += '<a href="/dealer-register.html">Dealer Status</a>';
    }
  } catch (e) {
    logout();
  }
}
loadProfile();
</script>
</body>
</html>
