<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compare Laptops — dbuggs</title>
<meta name="description" content="Compare refurbished laptops side by side — specs, grade, price, warranty.">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:#f1f3f6;color:#212121;font-size:14px;}
a{text-decoration:none;color:inherit;}
.header{background:#2874f0;padding:10px 20px;position:sticky;top:0;z-index:100;box-shadow:0 2px 4px rgba(0,0,0,.2);}
.header-inner{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:16px;}
.logo{font-size:20px;font-weight:700;color:#fff;}.logo span{color:#ffe500;}
.header-actions{margin-left:auto;display:flex;gap:10px;}
.hbtn{padding:8px 16px;border-radius:3px;font-size:13px;font-weight:600;cursor:pointer;border:none;font-family:inherit;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.4);}
.hbtn:hover{background:rgba(255,255,255,.25);}

.page{max-width:1200px;margin:20px auto;padding:0 20px;}
h1{font-size:22px;font-weight:700;margin-bottom:16px;}
.search-bar{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
.search-bar input{flex:1;min-width:200px;padding:10px 14px;border:1px solid #ddd;border-radius:6px;font-size:14px;}
.search-bar button{padding:10px 20px;background:#2874f0;color:#fff;border:none;border-radius:6px;font-weight:600;cursor:pointer;}
.search-bar button:hover{background:#1a5dc8;}

.results{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;}
.result-chip{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#fff;border:1px solid #ddd;border-radius:6px;font-size:13px;}
.result-chip .x{cursor:pointer;color:#c62828;font-weight:700;font-size:16px;}

.compare-table{width:100%;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.08);}
.compare-table th,.compare-table td{padding:12px 16px;text-align:left;border-bottom:1px solid #f0f0f0;font-size:13.5px;}
.compare-table th{background:#f8f9fb;font-weight:600;color:#878787;width:140px;white-space:nowrap;}
.compare-table td{font-weight:500;}
.compare-table .price{color:#388e3c;font-weight:700;font-size:16px;}
.compare-table .grade{display:inline-block;padding:3px 10px;border-radius:4px;font-weight:700;font-size:12px;background:#e8f5e9;color:#2e7d32;}
.add-btn{padding:8px 14px;background:#ff9f00;color:#fff;border:none;border-radius:4px;font-weight:600;font-size:13px;cursor:pointer;}
.add-btn:hover{background:#e08900;}

.empty{text-align:center;padding:60px 20px;color:#878787;font-size:15px;}
.empty p{margin-top:8px;}

@media(max-width:700px){.compare-table{display:block;overflow-x:auto;}.compare-table th{min-width:100px;}}
</style>
</head>
<body>
<div class="header"><div class="header-inner"><a href="/" class="logo">dbugg<span>s</span></a><div class="header-actions"><a href="/orders.html" class="hbtn">My Orders</a><a href="/cart.html" class="hbtn">Cart</a></div></div></div>

<div class="page">
<h1>Compare Laptops</h1>
<div class="search-bar">
  <input type="text" id="search" placeholder="Search by brand, model, processor..." oninput="searchProducts()">
  <button onclick="doCompare()">Compare Selected</button>
</div>
<div id="results" class="results"></div>
<div id="selected" class="results" style="margin-bottom:12px;"></div>

<div id="table-wrap"></div>
</div>

<script src="/shop-api.js"></script>
<script>
let allProducts=[], selected=[];

async function init(){
  try{
    const r=await fetch(API_BASE+'/products?limit=100');
    const d=await r.json();
    allProducts=d.data||d||[];
  }catch(e){allProducts=[];}

  const params=new URLSearchParams(location.search);
  const ids=(params.get('ids')||'').split(',').filter(Boolean);
  if(ids.length>=2){
    selected=ids;
    doCompare();
  }
  renderSelected();
}

function searchProducts(){
  const q=document.getElementById('search').value.toLowerCase().trim();
  const el=document.getElementById('results');
  if(!q||q.length<2){el.innerHTML='';return;}
  const hits=allProducts.filter(p=>!selected.includes(p.id)&&(`${p.brand} ${p.model} ${p.processor||''}`).toLowerCase().includes(q)).slice(0,8);
  el.innerHTML=hits.map(p=>`<div class="result-chip" onclick="addProduct('${p.id}')">${p.brand} ${p.model} <span style="color:#878787">${p.grade||''}</span> <b style="color:#388e3c">₹${Number(p.sellingPrice).toLocaleString('en-IN')}</b> <span style="color:#2874f0;cursor:pointer">+ Add</span></div>`).join('');
}

function addProduct(id){
  if(selected.length>=4){alert('Maximum 4 products can be compared');return;}
  if(!selected.includes(id))selected.push(id);
  document.getElementById('search').value='';
  document.getElementById('results').innerHTML='';
  renderSelected();
}

function removeProduct(id){
  selected=selected.filter(s=>s!==id);
  renderSelected();
  document.getElementById('table-wrap').innerHTML='';
}

function renderSelected(){
  const el=document.getElementById('selected');
  const items=selected.map(id=>{
    const p=allProducts.find(x=>x.id===id);
    const label=p?`${p.brand} ${p.model}`:`...${id.slice(-6)}`;
    return `<div class="result-chip">${label} <span class="x" onclick="removeProduct('${id}')">&times;</span></div>`;
  });
  el.innerHTML=items.join('');
}

async function doCompare(){
  if(selected.length<2){alert('Select at least 2 products to compare');return;}
  try{
    const res=await fetch(API_BASE+'/products/compare',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids:selected})});
    if(!res.ok)throw new Error((await res.json()).message||'Compare failed');
    const products=await res.json();
    renderTable(products);
  }catch(e){alert(e.message);}
}

function renderTable(products){
  const specs=[
    ['Brand','brand'],['Model','model'],['Grade','grade'],['Processor','processor'],
    ['RAM','ram'],['Storage','storage'],['Display','display'],['Price','sellingPrice'],
    ['Warranty','warrantyMonths'],
  ];
  let html='<table class="compare-table"><tbody>';
  for(const [label,key] of specs){
    html+=`<tr><th>${label}</th>`;
    for(const p of products){
      let val=p[key]||'—';
      if(key==='sellingPrice')val=`<span class="price">₹${Number(val).toLocaleString('en-IN')}</span>`;
      else if(key==='grade')val=`<span class="grade">${val}</span>`;
      else if(key==='warrantyMonths')val=val!=='—'?val+' months':val;
      html+=`<td>${val}</td>`;
    }
    html+='</tr>';
  }
  html+='<tr><th>Action</th>';
  for(const p of products) html+=`<td><button class="add-btn" onclick="addToCart({id:'${p.id}',brand:'${p.brand}',model:'${p.model}',grade:'${p.grade||''}',sellingPrice:${p.sellingPrice},serialNo:'${p.serialNo}'});alert('Added to cart!')">Add to Cart</button></td>`;
  html+='</tr></tbody></table>';
  document.getElementById('table-wrap').innerHTML=html;
}

init();
</script>
</body>
</html>
