<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sales - Dealer Portal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#f5f7fa;color:#1a1a2e;min-height:100vh}
.topbar{background:#1a1a2e;color:#fff;padding:12px 24px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.topbar h1{font-size:18px;font-weight:700}
.topbar-right{display:flex;align-items:center;gap:12px}
.topbar-right a{color:#94a3b8;text-decoration:none;font-size:13px}.topbar-right a:hover{color:#fff}
.nav{background:#fff;border-bottom:1px solid #e2e8f0;padding:0 24px;display:flex;gap:0;overflow-x:auto}
.nav a{padding:12px 16px;color:#64748b;text-decoration:none;font-size:13px;font-weight:500;white-space:nowrap;border-bottom:2px solid transparent}
.nav a:hover{color:#1a1a2e}.nav a.active{color:#7c3aed;border-bottom-color:#7c3aed}
.container{max-width:1100px;margin:0 auto;padding:24px}
.card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:20px}
.card h3{font-size:15px;font-weight:600;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:8px 12px;background:#f8fafc;color:#64748b;font-weight:500;font-size:11px;text-transform:uppercase}
td{padding:10px 12px;border-top:1px solid #f1f5f9}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:500}
.btn-primary{background:#7c3aed;color:#fff}.btn-primary:hover{background:#6d28d9}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center}
.modal.show{display:flex}
.modal-content{background:#fff;border-radius:16px;padding:24px;width:90%;max-width:480px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;font-weight:500;color:#64748b;margin-bottom:4px}
.form-group input{width:100%;padding:8px 12px;border:1px solid #e2e8f0;border-radius:8px;font-size:14px}
.empty{text-align:center;color:#94a3b8;padding:32px;font-size:14px}
.comm-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:24px}
.comm-card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.06);text-align:center}
.comm-card .val{font-size:24px;font-weight:700;color:#7c3aed}.comm-card .lbl{font-size:11px;color:#64748b;text-transform:uppercase;margin-top:2px}
</style>
</head>
<body>
<div class="topbar"><h1>Dbuggs Dealer</h1><div class="topbar-right"><a href="/">Shop</a><a href="#" onclick="logout()">Logout</a></div></div>
<nav class="nav">
  <a href="dealer-dashboard.html">Dashboard</a>
  <a href="dealer-stock-orders.html">Stock Orders</a>
  <a href="dealer-inventory.html">Inventory</a>
  <a href="dealer-sales.html" class="active">Sales</a>
  <a href="dealer-leads.html">Leads</a>
  <a href="dealer-leaderboard.html">Leaderboard</a>
</nav>
<div class="container">
  <div class="comm-stats" id="commStats"></div>
  <div class="card">
    <h3>Sales History <button class="btn btn-primary" onclick="openSale()">+ Record Sale</button></h3>
    <div id="salesList"><div class="empty">Loading...</div></div>
  </div>
  <div class="card">
    <h3>Commission History</h3>
    <div id="commList"><div class="empty">Loading...</div></div>
  </div>
</div>

<div class="modal" id="saleModal">
  <div class="modal-content">
    <h3 style="font-size:16px;font-weight:600;margin-bottom:16px">Record Customer Sale</h3>
    <div class="form-group"><label>Customer Name *</label><input id="custName" placeholder="Customer name"></div>
    <div class="form-group"><label>Customer Phone *</label><input id="custPhone" placeholder="Phone number"></div>
    <div class="form-group"><label>Laptop ID *</label><input id="laptopId" placeholder="Laptop UUID from inventory"></div>
    <div class="form-group"><label>Sale Amount (₹) *</label><input id="saleAmount" type="number" placeholder="Total sale amount incl. GST"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">
      <button class="btn" style="background:#e2e8f0" onclick="closeSale()">Cancel</button>
      <button class="btn btn-primary" onclick="submitSale()">Record Sale</button>
    </div>
  </div>
</div>

<script>
const API = window.location.hostname==='localhost'?'http://localhost:4000':'http://200.234.39.146:4000';
function getToken(){return localStorage.getItem('dbugg_shop_token')}
function logout(){localStorage.removeItem('dbugg_shop_token');window.location.href='/login.html'}
async function api(path,opts={}){const r=await fetch(API+path,{headers:{'Authorization':'Bearer '+getToken(),'Content-Type':'application/json'},...opts});if(r.status===401){logout();return null}return r.json()}

async function load(){
  if(!getToken()){window.location.href='/login.html';return}
  const [sales, comms] = await Promise.all([api('/dealer/sales'), api('/dealer/commissions')]);

  const totalSales = (sales||[]).reduce((s,x)=>s+Number(x.saleAmount),0);
  const totalComm = (comms||[]).filter(c=>Number(c.netAmount)>0).reduce((s,c)=>s+Number(c.netAmount),0);
  const totalTds = (comms||[]).reduce((s,c)=>s+Number(c.tdsAmount),0);

  document.getElementById('commStats').innerHTML = `
    <div class="comm-card"><div class="val">${(sales||[]).length}</div><div class="lbl">Total Sales</div></div>
    <div class="comm-card"><div class="val">₹${totalSales.toLocaleString('en-IN')}</div><div class="lbl">Total Revenue</div></div>
    <div class="comm-card"><div class="val">₹${Math.round(totalComm).toLocaleString('en-IN')}</div><div class="lbl">Net Commission</div></div>
    <div class="comm-card"><div class="val">₹${Math.round(totalTds).toLocaleString('en-IN')}</div><div class="lbl">TDS Deducted</div></div>
  `;

  if(!(sales||[]).length){document.getElementById('salesList').innerHTML='<div class="empty">No sales recorded yet</div>'}
  else{document.getElementById('salesList').innerHTML='<table><thead><tr><th>Invoice</th><th>Customer</th><th>Phone</th><th>Amount</th><th>GST</th><th>Commission</th><th>Date</th></tr></thead><tbody>'+
    sales.map(s=>`<tr><td><strong>${s.invoiceNumber}</strong></td><td>${s.customerName}</td><td>${s.customerPhone}</td><td>₹${Number(s.saleAmount).toLocaleString('en-IN')}</td><td>₹${Number(s.gstAmount).toLocaleString('en-IN')}</td><td style="color:#166534">₹${Number(s.commissionEarned).toLocaleString('en-IN')}</td><td>${new Date(s.createdAt).toLocaleDateString('en-IN')}</td></tr>`).join('')+
    '</tbody></table>'}

  if(!(comms||[]).length){document.getElementById('commList').innerHTML='<div class="empty">No commissions yet</div>'}
  else{document.getElementById('commList').innerHTML='<table><thead><tr><th>Sale Amount</th><th>Rate</th><th>Commission</th><th>TDS</th><th>Net</th><th>Status</th><th>Date</th></tr></thead><tbody>'+
    comms.map(c=>`<tr><td>₹${Number(c.saleAmount).toLocaleString('en-IN')}</td><td>${c.commissionRate}%</td><td>₹${Number(c.commissionAmount).toLocaleString('en-IN')}</td><td>₹${Number(c.tdsAmount).toLocaleString('en-IN')}</td><td style="color:#166534;font-weight:600">₹${Number(c.netAmount).toLocaleString('en-IN')}</td><td>${c.status}</td><td>${new Date(c.createdAt).toLocaleDateString('en-IN')}</td></tr>`).join('')+
    '</tbody></table>'}

  if(new URLSearchParams(location.search).get('new')==='1') openSale();
}

function openSale(){document.getElementById('saleModal').classList.add('show')}
function closeSale(){document.getElementById('saleModal').classList.remove('show')}
async function submitSale(){
  const data={customerName:document.getElementById('custName').value,customerPhone:document.getElementById('custPhone').value,laptopId:document.getElementById('laptopId').value,saleAmount:Number(document.getElementById('saleAmount').value)};
  if(!data.customerName||!data.laptopId||!data.saleAmount){alert('Fill all required fields');return}
  const res=await api('/dealer/sales',{method:'POST',body:JSON.stringify(data)});
  if(res&&res.invoiceNumber){closeSale();load()}else{alert(res?.message||'Error')}
}
load();
</script>
</body>
</html>
