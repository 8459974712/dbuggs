<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B2B Panel — dbuggs</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../panel-shared.css">
<link rel="stylesheet" href="b2b-panel.css">
</head>
<body>
<aside class="sidebar">
  <div class="sidebar-logo"><div class="brand">d<span>bugg</span>s</div><div class="tagline">B2B Partner Panel</div></div>
  <nav class="nav-section">
    <a href="dashboard.html" class="nav-item active"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>Dashboard</a>
    <a href="orders.html" class="nav-item"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4h-2l-3 9v2h18v-2l-3-9h-2l1 4H6L7 4z"/></svg>My Orders</a>
    <a href="bulk-order.html" class="nav-item"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>Bulk Order</a>
    <a href="rfq.html" class="nav-item"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6z"/></svg>RFQ / Quotations</a>
    <a href="ledger.html" class="nav-item"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM7 7h2v2H7V7zm0 4h2v2H7v-2zm0 4h2v2H7v-2zm10 2h-6v-2h6v2zm0-4h-6v-2h6v2zm0-4h-6V7h6v2z"/></svg>Credit Ledger</a>
    <a href="../index.html" class="nav-item"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4c-1.11 0-2 .89-2 2v12c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V6c0-1.11-.89-2-2-2z"/></svg>Browse Shop</a>
  </nav>
  <div class="sidebar-footer">
    <div class="user-info"><div class="avatar" id="avatar">B</div><div><div class="user-name" id="uname">Loading</div><div class="logout-link" onclick="logout()">Logout</div></div></div>
  </div>
</aside>
<div class="main-wrapper">
  <header class="topbar"><div class="topbar-title">Dashboard</div></header>
  <main class="page-content" id="content">Loading...</main>
</div>

<script src="../shop-api.js"></script>
<script>
if (!getToken()) window.location.href = '/login.html';
const user = getUser();
if (user) { document.getElementById('uname').textContent = user.name || user.email; document.getElementById('avatar').textContent = (user.name || 'B')[0].toUpperCase(); }

async function load() {
  const el = document.getElementById('content');
  try {
    const profile = await apiFetch('/b2b/my');
    if (!profile || !profile.id) {
      window.location.href = '/b2b-register.html';
      return;
    }
    if (!profile.isApproved) {
      el.innerHTML = `<div class="status-banner status-pending">⏳ Your B2B application is awaiting admin approval. You'll get wholesale pricing and credit terms once approved.</div>`;
      return;
    }
    const orders = (await apiFetch('/orders')).filter(o => o.type === 'b2b');
    const totalSpend = orders.reduce((s, o) => s + Number(o.amount || 0), 0);
    const creditAvailable = Number(profile.creditLimit) - Number(profile.creditUsed || 0);

    el.innerHTML = `
      <div class="status-banner status-approved">✓ Approved B2B Partner — ${profile.companyName || profile.gstin}</div>
      <div class="stat-grid">
        <div class="stat-tile"><div class="label">Credit Limit</div><div class="value">${money(profile.creditLimit)}</div><div class="sub">Total sanctioned</div></div>
        <div class="stat-tile"><div class="label">Credit Available</div><div class="value">${money(creditAvailable)}</div><div class="sub">Used: ${money(profile.creditUsed || 0)}</div></div>
        <div class="stat-tile"><div class="label">Total Orders</div><div class="value">${orders.length}</div><div class="sub">Bulk purchases</div></div>
        <div class="stat-tile"><div class="label">Total Spend</div><div class="value">${money(totalSpend)}</div><div class="sub">All time</div></div>
      </div>
      <div class="card">
        <div class="card-header"><div class="card-title">Recent Orders</div><a href="orders.html" style="font-size:12.5px;color:var(--accent);font-weight:600;">View All →</a></div>
        ${orders.length === 0 ? '<div class="empty">No orders yet. <a href="../index.html" style="color:var(--accent);">Browse the shop →</a></div>' : `
        <table><thead><tr><th>Order No.</th><th>Date</th><th>Amount</th><th>Status</th></tr></thead>
        <tbody>${orders.slice(0,5).map(o => `<tr><td style="font-weight:600;color:var(--accent);">${o.orderNumber}</td><td>${new Date(o.createdAt).toLocaleDateString('en-IN')}</td><td style="font-weight:600;">${money(o.amount)}</td><td><span class="chip" style="background:var(--blue-bg);color:#1E40AF;">${o.status}</span></td></tr>`).join('')}</tbody></table>`}
      </div>
    `;
  } catch (e) {
    el.innerHTML = `<div class="empty">Error: ${e.message}</div>`;
  }
}
load();
</script>
</body>
</html>
