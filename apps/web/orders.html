<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Orders — dbuggs</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#1C2B6B;--accent:#F07830;--bg:#F7F8FC;--card:#fff;--border:#E5E7EB;--text:#111827;--text-sec:#6B7280;
--green-bg:#D1FAE5;--green:#065F46;--blue-bg:#DBEAFE;--blue:#1E40AF;--orange-bg:#FEF3C7;--orange:#92400E;--red-bg:#FEE2E2;--red:#991B1B;--gray-bg:#F3F4F6;--gray:#374151;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);}
h1,h2,h3{font-family:'Space Grotesk',sans-serif;}
a{text-decoration:none;color:inherit;}
.topbar{background:var(--navy);padding:14px 28px;display:flex;align-items:center;gap:24px;}
.brand{font-family:'Space Grotesk',sans-serif;font-size:21px;font-weight:700;color:#fff;}
.brand span{color:var(--accent);}
.back-link{color:rgba(255,255,255,0.8);font-size:13px;}
.container{max-width:760px;margin:30px auto;padding:0 20px;}
h2{margin-bottom:18px;}
.order{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
.order-id{font-weight:700;color:var(--accent);font-size:14px;}
.order-date{font-size:11.5px;color:var(--text-sec);margin-top:2px;}
.order-amount{font-weight:700;font-size:15px;}
.chip{font-size:11.5px;font-weight:600;padding:4px 11px;border-radius:20px;}
.chip-pending{background:var(--gray-bg);color:var(--gray);}
.chip-confirmed,.chip-processing{background:var(--orange-bg);color:var(--orange);}
.chip-shipped{background:var(--blue-bg);color:var(--blue);}
.chip-delivered{background:var(--green-bg);color:var(--green);}
.chip-cancelled,.chip-returned{background:var(--red-bg);color:var(--red);}
.empty{text-align:center;padding:50px 20px;color:var(--text-sec);}
</style>
</head>
<body>
<div class="topbar">
  <a href="/index.html" class="brand">d<span>bugg</span>s</a>
  <a href="/index.html" class="back-link">← Continue shopping</a>
</div>
<div class="container">
  <h2>My Orders</h2>
  <div id="orders-list">Loading...</div>
</div>

<script src="shop-api.js"></script>
<script>
if (!getToken()) window.location.href = '/login.html';

const chipMap = {
  pending: 'chip-pending', confirmed: 'chip-confirmed', processing: 'chip-processing',
  shipped: 'chip-shipped', delivered: 'chip-delivered', cancelled: 'chip-cancelled',
  return_requested: 'chip-processing', returned: 'chip-returned',
};

async function loadOrders() {
  const el = document.getElementById('orders-list');
  try {
    const orders = await apiFetch('/orders');
    if (!orders || orders.length === 0) {
      el.innerHTML = '<div class="empty">No orders yet. <a href="/index.html" style="color:var(--accent);font-weight:600;">Start shopping →</a></div>';
      return;
    }
    el.innerHTML = orders.map(o => `
      <div class="order">
        <div>
          <div class="order-id">${o.orderNumber}</div>
          <div class="order-date">${new Date(o.createdAt).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' })}</div>
        </div>
        <div class="order-amount">${money(o.amount)}</div>
        <span class="chip ${chipMap[o.status] || 'chip-pending'}">${o.status.replace('_', ' ')}</span>
      </div>
    `).join('');
  } catch (e) {
    el.innerHTML = `<div class="empty">Error: ${e.message}</div>`;
  }
}
loadOrders();
</script>
</body>
</html>
