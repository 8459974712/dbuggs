<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Orders — dbuggs</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:#f1f3f6;color:#212121;font-size:14px;}
a{text-decoration:none;color:inherit;}

/* ── HEADER ── */
.header{background:#2874f0;padding:10px 20px;position:sticky;top:0;z-index:100;box-shadow:0 2px 4px rgba(0,0,0,.2);}
.header-inner{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:16px;}
.logo{font-size:20px;font-weight:700;color:#fff;white-space:nowrap;flex-shrink:0;}
.logo span{color:#ffe500;}
.header-actions{display:flex;align-items:center;gap:10px;margin-left:auto;}
.hbtn{padding:8px 16px;border-radius:3px;font-size:13px;font-weight:600;cursor:pointer;border:none;font-family:inherit;}
.hbtn-outline{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.4);}
.hbtn-outline:hover{background:rgba(255,255,255,.25);}
.header-user{display:flex;align-items:center;gap:8px;color:#fff;font-size:13.5px;font-weight:600;}

/* ── BREADCRUMB ── */
.breadcrumb{max-width:1280px;margin:14px auto 0;padding:0 20px;font-size:12.5px;color:#878787;}
.breadcrumb a{color:#878787;}.breadcrumb a:hover{color:#2874f0;}
.breadcrumb span{margin:0 6px;color:#ccc;}

/* ── LAYOUT ── */
.layout{max-width:1280px;margin:12px auto 40px;padding:0 20px;display:flex;gap:14px;align-items:flex-start;}

/* ── FILTER SIDEBAR ── */
.filter-sidebar{width:230px;flex-shrink:0;background:#fff;border-radius:4px;overflow:hidden;}
.fs-head{padding:14px 16px;border-bottom:1px solid #f0f0f0;display:flex;align-items:center;justify-content:space-between;}
.fs-head h3{font-size:14px;font-weight:700;color:#212121;text-transform:uppercase;letter-spacing:.04em;}
.fs-clear{font-size:12.5px;color:#2874f0;cursor:pointer;font-weight:600;}
.filter-section{padding:14px 16px;border-bottom:1px solid #f0f0f0;}
.filter-section-title{font-size:12px;font-weight:700;color:#212121;text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px;}
.filter-option{display:flex;align-items:center;gap:9px;padding:4px 0;cursor:pointer;font-size:13px;color:#333;}
.filter-option input[type=checkbox]{accent-color:#2874f0;width:14px;height:14px;cursor:pointer;flex-shrink:0;}
.filter-option span{line-height:1.3;}

/* ── MAIN AREA ── */
.orders-main{flex:1;min-width:0;}
.search-bar{background:#fff;border-radius:4px;padding:12px 16px;display:flex;gap:0;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.search-bar input{flex:1;border:1px solid #e0e0e0;border-right:none;border-radius:3px 0 0 3px;padding:9px 14px;font-size:13.5px;font-family:inherit;outline:none;}
.search-bar input:focus{border-color:#2874f0;}
.search-bar button{background:#2874f0;color:#fff;border:none;border-radius:0 3px 3px 0;padding:0 20px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:inherit;}
.search-bar button:hover{background:#1a5fd1;}

/* ── ORDER CARD ── */
.order-card{background:#fff;border-radius:4px;margin-bottom:10px;overflow:hidden;border:1px solid #e8e8e8;}
.order-card-header{padding:10px 16px;background:#f8f9fa;border-bottom:1px solid #f0f0f0;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.order-num{font-size:13px;font-weight:700;color:#2874f0;}
.order-date-label{font-size:12px;color:#878787;}
.order-total-label{font-size:13px;color:#212121;font-weight:600;margin-left:auto;}
.order-item-row{padding:16px;display:flex;gap:16px;align-items:flex-start;border-bottom:1px solid #f5f5f5;}
.order-item-row:last-child{border-bottom:none;}
.item-img{width:80px;height:64px;object-fit:contain;flex-shrink:0;border-radius:3px;border:1px solid #f0f0f0;background:#f8f9fa;display:flex;align-items:center;justify-content:center;}
.item-img img{width:80px;height:64px;object-fit:contain;}
.item-img-placeholder{font-size:28px;opacity:.5;}
.item-info{flex:1;min-width:0;}
.item-name{font-size:14px;font-weight:600;color:#212121;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.item-specs{font-size:12px;color:#878787;margin-bottom:6px;}
.item-price{font-size:14px;font-weight:700;color:#212121;}
.item-status{flex-shrink:0;text-align:right;min-width:160px;}
.status-dot-row{display:flex;align-items:center;gap:7px;justify-content:flex-end;margin-bottom:4px;}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.dot-green{background:#388e3c;}.dot-blue{background:#2874f0;}.dot-orange{background:#ff6600;}.dot-red{background:#c62828;}.dot-gray{background:#878787;}
.status-label{font-size:13px;font-weight:600;}
.status-label.green{color:#388e3c;}.status-label.blue{color:#2874f0;}.status-label.orange{color:#ff6600;}.status-label.red{color:#c62828;}.status-label.gray{color:#878787;}
.status-sublabel{font-size:12px;color:#878787;}
.item-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.act-btn{padding:6px 14px;border-radius:3px;font-size:12.5px;font-weight:700;cursor:pointer;border:none;font-family:inherit;}
.act-track{background:#2874f0;color:#fff;}.act-track:hover{background:#1a5fd1;}
.act-review{background:#ff9f00;color:#fff;}.act-review:hover{background:#e08e00;}
.act-return{background:none;color:#2874f0;border:1px solid #2874f0;}.act-return:hover{background:#f0f4ff;}
.act-cancel{background:none;color:#c62828;border:1px solid #c62828;}.act-cancel:hover{background:#fff5f5;}
.no-items-order{padding:16px;display:flex;justify-content:space-between;align-items:center;}

/* ── EMPTY STATE ── */
.empty-state{background:#fff;border-radius:4px;padding:60px 20px;text-align:center;color:#878787;}
.empty-state svg{width:64px;height:64px;color:#e0e0e0;margin-bottom:14px;}
.empty-state p{font-size:16px;font-weight:600;color:#212121;margin-bottom:6px;}
.empty-state small{font-size:13px;}
.empty-state a{color:#2874f0;font-weight:600;}

/* ── TRACKING MODAL ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:999;align-items:center;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal{background:#fff;border-radius:6px;width:520px;max-width:96vw;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.25);}
.modal-head{padding:14px 20px;border-bottom:1px solid #e0e0e0;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:1;}
.modal-head h3{font-size:16px;font-weight:700;}
.modal-close{background:none;border:none;font-size:24px;cursor:pointer;color:#878787;line-height:1;padding:0 4px;}
.modal-body{padding:20px;}
.track-product-row{display:flex;gap:14px;align-items:center;background:#f8f9fa;border-radius:6px;padding:14px;margin-bottom:20px;}
.track-product-img{width:72px;height:56px;object-fit:contain;flex-shrink:0;}
.track-product-name{font-size:14px;font-weight:600;margin-bottom:3px;}
.track-product-specs{font-size:12px;color:#878787;}
.track-id-row{background:#e8f4ff;border-radius:5px;padding:10px 14px;font-size:12.5px;color:#1a5fd1;font-weight:600;margin-bottom:20px;display:flex;align-items:center;gap:8px;}
.track-id-row svg{width:15px;height:15px;flex-shrink:0;}
.timeline{position:relative;padding-left:28px;}
.timeline-step{position:relative;padding-bottom:24px;}
.timeline-step:last-child{padding-bottom:0;}
.tl-dot{position:absolute;left:-28px;top:2px;width:14px;height:14px;border-radius:50%;border:2px solid #e0e0e0;background:#fff;}
.tl-dot.done{background:#388e3c;border-color:#388e3c;}
.tl-dot.active{background:#2874f0;border-color:#2874f0;}
.timeline-step:not(:last-child)::before{content:'';position:absolute;left:-22px;top:16px;width:2px;height:calc(100% - 8px);background:#e0e0e0;}
.timeline-step:not(:last-child).done::before{background:#388e3c;}
.tl-title{font-size:13.5px;font-weight:700;color:#212121;margin-bottom:4px;}
.tl-date{font-size:12px;color:#878787;}
.tl-sub{font-size:12px;color:#555;margin-top:2px;}
.tl-step-done .tl-title{color:#388e3c;}

/* ── LOADING ── */
.order-skeleton{background:#fff;border-radius:4px;margin-bottom:10px;padding:20px;animation:pulse 1.4s infinite;}
.sk-line{height:13px;background:#f0f0f0;border-radius:4px;margin-bottom:8px;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

/* ── MOBILE FILTER TOGGLE ── */
.mobile-filter-btn{display:none;align-items:center;gap:7px;padding:9px 16px;background:#fff;border:1px solid #e0e0e0;border-radius:4px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;margin-bottom:10px;width:100%;}
.mobile-filter-btn svg{width:16px;height:16px;color:#2874f0;}
.filter-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:300;}
.filter-overlay.open{display:block;}

/* ── TABLET (≤900px) ── */
@media(max-width:900px){
  .filter-sidebar{width:200px;}
  .item-status{min-width:130px;}
}

/* ── MOBILE (≤640px) ── */
@media(max-width:640px){
  /* Header */
  .header{padding:8px 12px;}
  .header-inner{gap:8px;}
  .header-actions{gap:6px;}
  .hbtn{padding:7px 10px;font-size:12px;}

  /* Breadcrumb */
  .breadcrumb{padding:0 12px;margin-top:10px;}

  /* Layout */
  html,body{overflow-x:hidden;max-width:100vw;}
  .layout{display:block;padding:0 8px;margin-top:8px;}
  .filter-sidebar{display:none;}
  .filter-sidebar.open{display:block;position:fixed;left:0;top:0;bottom:0;width:280px;z-index:400;overflow-y:auto;background:#fff;box-shadow:4px 0 24px rgba(0,0,0,.22);}
  .orders-main{width:100%;}
  .mobile-filter-btn{display:flex;}

  /* Search bar */
  .search-bar{flex-wrap:wrap;}
  .search-bar input{border-radius:3px;border-right:1px solid #e0e0e0;margin-bottom:6px;flex:0 0 100%;}
  .search-bar button{flex:1;border-radius:3px;}

  /* Order card header */
  .order-card-header{gap:6px;}
  .order-total-label{margin-left:0;width:100%;}

  /* Order item row — stack on mobile */
  .order-item-row{flex-wrap:wrap;gap:10px;}
  .item-status{min-width:0;width:100%;text-align:left;}
  .status-dot-row{justify-content:flex-start;}
  .item-actions{justify-content:flex-start;}

  /* Item image smaller */
  .item-img,.item-img img{width:64px;height:52px;}
}

/* ── BOTTOM NAV (mobile only) ── */
.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e0e0e0;z-index:500;}
.bottom-nav-inner{display:flex;}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:#555;text-decoration:none;padding:8px 4px 10px;cursor:pointer;position:relative;}
.bn-item.active{color:#2874f0;}
.bn-item svg{width:24px;height:24px;}
.bn-pos{position:relative;display:inline-flex;}
.bn-badge{position:absolute;top:-5px;right:-8px;background:#ff6161;color:#fff;font-size:9px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:none;align-items:center;justify-content:center;padding:0 3px;}
@media(max-width:640px){
  .bottom-nav{display:block;}
  body{padding-bottom:62px;}
}
</style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="header-inner">
    <a href="/index.html" class="logo">d<span>bugg</span>s</a>
    <div class="header-actions">
      <span class="header-user" id="header-user"></span>
      <button class="hbtn hbtn-outline" onclick="window.location='/index.html'">← Continue Shopping</button>
      <button class="hbtn hbtn-outline" onclick="logout(); window.location='/login.html'">Logout</button>
    </div>
  </div>
</header>

<!-- BREADCRUMB -->
<div class="breadcrumb">
  <a href="/index.html">Home</a><span>›</span>
  <a href="/account.html">My Account</a><span>›</span>
  <span style="color:#212121;">My Orders</span>
</div>

<!-- LAYOUT -->
<div class="filter-overlay" id="filter-overlay" onclick="closeFilterSidebar()"></div>
<div class="layout">

  <!-- Mobile filter toggle -->
  <button class="mobile-filter-btn" onclick="openFilterSidebar()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="14" y2="12"/><line x1="4" y1="18" x2="11" y2="18"/></svg>
    Filters
  </button>

  <!-- FILTER SIDEBAR -->
  <aside class="filter-sidebar" id="filter-sidebar">
    <div class="fs-head">
      <h3>Filters</h3>
      <span class="fs-clear" onclick="clearFilters()">Clear All</span>
    </div>
    <div class="filter-section">
      <div class="filter-section-title">Order Status</div>
      <label class="filter-option"><input type="checkbox" value="on_way" onchange="applyFilters()"><span>On the Way</span></label>
      <label class="filter-option"><input type="checkbox" value="delivered" onchange="applyFilters()"><span>Delivered</span></label>
      <label class="filter-option"><input type="checkbox" value="cancelled" onchange="applyFilters()"><span>Cancelled</span></label>
      <label class="filter-option"><input type="checkbox" value="return_requested,returned" onchange="applyFilters()"><span>Returned</span></label>
    </div>
    <div class="filter-section">
      <div class="filter-section-title">Order Time</div>
      <label class="filter-option"><input type="checkbox" value="30days" onchange="applyFilters()"><span>Last 30 days</span></label>
      <label class="filter-option"><input type="checkbox" value="2026" onchange="applyFilters()"><span>2026</span></label>
      <label class="filter-option"><input type="checkbox" value="2025" onchange="applyFilters()"><span>2025</span></label>
      <label class="filter-option"><input type="checkbox" value="older" onchange="applyFilters()"><span>Older</span></label>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="orders-main">
    <div class="search-bar">
      <input type="text" id="search-orders" placeholder="Search your orders here" oninput="applyFilters()">
      <button onclick="applyFilters()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="vertical-align:middle;margin-right:5px;"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        Search Orders
      </button>
    </div>
    <div id="orders-list">
      <div class="order-skeleton"><div class="sk-line" style="width:40%"></div><div class="sk-line" style="width:70%"></div><div class="sk-line" style="width:55%"></div></div>
      <div class="order-skeleton"><div class="sk-line" style="width:35%"></div><div class="sk-line" style="width:65%"></div><div class="sk-line" style="width:50%"></div></div>
    </div>
  </div>
</div>

<!-- TRACKING MODAL -->
<div class="modal-overlay" id="track-modal">
  <div class="modal">
    <div class="modal-head">
      <h3 id="track-title">Track Package</h3>
      <button class="modal-close" onclick="closeTrackModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="track-product-row" id="track-product-row"></div>
      <div class="track-id-row" id="track-id-row" style="display:none;">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 8h-3V4H3c-1.1 0-2 .9-2 2v11h2c0 1.66 1.34 3 3 3s3-1.34 3-3h6c0 1.66 1.34 3 3 3s3-1.34 3-3h2v-5l-3-4zm-.5 1.5L21.46 13H17V9.5h2.5zM6 18c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm2.22-3c-.55-.61-1.33-1-2.22-1s-1.67.39-2.22 1H3V6h12v9H8.22zM18 18c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z"/></svg>
        <span id="track-id-text">Tracking ID: —</span>
      </div>
      <div class="timeline" id="track-timeline"></div>
    </div>
  </div>
</div>

<script src="shop-api.js"></script>
<script>
if (!getToken()) window.location.href = '/login.html';

const user = getUser();
if (user) {
  const name = (user.name || '').split(' ')[0] || 'Account';
  document.getElementById('header-user').textContent = 'Hello, ' + name;
}

let allOrders = [];

// ── Status helpers ──────────────────────────────────────────────
const statusConfig = {
  pending:         { label: 'Order Placed',    sub: 'Waiting for confirmation', cls: 'blue',   dot: 'dot-blue' },
  confirmed:       { label: 'Confirmed',        sub: 'Processing your order',    cls: 'blue',   dot: 'dot-blue' },
  processing:      { label: 'Processing',       sub: 'Getting ready to ship',    cls: 'orange', dot: 'dot-orange' },
  shipped:         { label: 'Shipped',          sub: '',                         cls: 'blue',   dot: 'dot-blue' },
  out_for_delivery:{ label: 'Out for Delivery', sub: 'Arriving today',           cls: 'orange', dot: 'dot-orange' },
  delivered:       { label: 'Delivered',        sub: '',                         cls: 'green',  dot: 'dot-green' },
  cancelled:       { label: 'Cancelled',        sub: '',                         cls: 'red',    dot: 'dot-red' },
  return_requested:{ label: 'Return Requested', sub: 'Under review',             cls: 'orange', dot: 'dot-orange' },
  returned:        { label: 'Returned',         sub: 'Refund processed',         cls: 'gray',   dot: 'dot-gray' },
};

function statusInfo(status) {
  return statusConfig[status] || { label: status, sub: '', cls: 'gray', dot: 'dot-gray' };
}

function fmtDate(d) {
  if (!d) return '';
  return new Date(d).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
}

function deliveryDateLabel(o) {
  if (o.status === 'delivered' && o.deliveredAt) return `Delivered on ${fmtDate(o.deliveredAt)}`;
  if (o.status === 'shipped' && o.expectedDelivery) return `Delivery expected by ${fmtDate(o.expectedDelivery)}`;
  if (o.status === 'out_for_delivery') return 'Out for delivery today';
  if (o.status === 'cancelled') return `Cancelled on ${fmtDate(o.updatedAt || o.createdAt)}`;
  if (o.status === 'returned') return `Returned on ${fmtDate(o.updatedAt || o.createdAt)}`;
  return `Ordered on ${fmtDate(o.createdAt)}`;
}

function imgOrPlaceholder(url, name) {
  if (url) return `<img src="${url}" alt="${name||''}" onerror="this.src='images/laptop-placeholder.svg'">`;
  return `<div class="item-img-placeholder">💻</div>`;
}

function buildActButtons(o) {
  const btns = [];
  if (['shipped','out_for_delivery','processing','confirmed'].includes(o.status)) {
    btns.push(`<button class="act-btn act-track" onclick="openTrackModal(event,'${o.id}')">Track Package</button>`);
  }
  if (o.status === 'delivered') {
    btns.push(`<button class="act-btn act-review" onclick="window.location='/product.html?id=${(o.items&&o.items[0])?o.items[0].productId:''}'">Rate &amp; Review</button>`);
    btns.push(`<button class="act-btn act-return" onclick="requestReturn('${o.id}')">Return</button>`);
  }
  if (['pending','confirmed'].includes(o.status)) {
    btns.push(`<button class="act-btn act-cancel" onclick="cancelOrder('${o.id}')">Cancel</button>`);
  }
  if (o.status === 'delivered') {
    btns.push(`<button class="act-btn act-track" onclick="openTrackModal(event,'${o.id}')">View Updates</button>`);
  }
  if (['confirmed','processing','shipped','out_for_delivery','delivered','return_requested'].includes(o.status)) {
    btns.push(`<button class="act-btn act-track" onclick="openDoc('/orders/${o.id}/invoice.pdf','Invoice-${o.orderNumber}.pdf')">GST Invoice</button>`);
    btns.push(`<button class="act-btn act-track" onclick="openDoc('/orders/${o.id}/warranty-card.pdf','Warranty-${o.orderNumber}.pdf')">Warranty Card</button>`);
  }
  if (['cancelled','returned'].includes(o.status) && o.gstInvoiceUrl) {
    btns.push(`<button class="act-btn act-track" onclick="openDoc('/orders/${o.id}/credit-note.pdf','CreditNote-${o.orderNumber}.pdf')">Credit Note</button>`);
  }
  return btns.join('');
}

function renderOrders(orders) {
  const el = document.getElementById('orders-list');
  if (!orders.length) {
    el.innerHTML = `<div class="empty-state">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm2 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
      <p>No orders found</p>
      <small>Try adjusting your filters or <a href="/index.html">browse our laptops →</a></small>
    </div>`;
    return;
  }

  el.innerHTML = orders.map(o => {
    const si = statusInfo(o.status);
    const items = o.items || [];
    const totalLabel = `₹${Number(o.amount || 0).toLocaleString('en-IN')}`;

    if (items.length === 0) {
      return `<div class="order-card">
        <div class="order-card-header">
          <span class="order-num">${o.orderNumber || o.id}</span>
          <span class="order-date-label">${fmtDate(o.createdAt)}</span>
          <span class="order-total-label">${totalLabel}</span>
        </div>
        <div class="no-items-order">
          <div>
            <div style="font-size:14px;font-weight:600;margin-bottom:4px;">Order #${o.orderNumber || o.id}</div>
            <div class="status-dot-row" style="justify-content:flex-start;">
              <div class="dot ${si.dot}"></div>
              <span class="status-label ${si.cls}">${si.label}</span>
            </div>
            <div style="font-size:12px;color:#878787;margin-top:3px;">${deliveryDateLabel(o)}</div>
          </div>
          <div>${buildActButtons(o)}</div>
        </div>
      </div>`;
    }

    return `<div class="order-card">
      <div class="order-card-header">
        <span class="order-num">${o.orderNumber || o.id}</span>
        <span class="order-date-label">${fmtDate(o.createdAt)}</span>
        <span class="order-total-label">${totalLabel}</span>
      </div>
      ${items.map(item => `
        <div class="order-item-row">
          <div class="item-img">${imgOrPlaceholder(item.imageUrl, item.name)}</div>
          <div class="item-info">
            <div class="item-name">${item.name || item.model || 'Laptop'}</div>
            <div class="item-specs">${[item.brand, item.processor, item.ram, item.storage, item.grade ? 'Grade '+item.grade : ''].filter(Boolean).join(' · ')}</div>
            <div class="item-price">₹${(item.price || o.amount || 0).toLocaleString('en-IN')}</div>
            <div class="item-actions">${buildActButtons(o)}</div>
          </div>
          <div class="item-status">
            <div class="status-dot-row">
              <div class="dot ${si.dot}"></div>
              <span class="status-label ${si.cls}">${si.label}</span>
            </div>
            <div class="status-sublabel">${deliveryDateLabel(o)}</div>
            ${o.status === 'delivered' ? '<div style="margin-top:8px;"><span style="color:#2874f0;font-size:12.5px;font-weight:600;cursor:pointer;" onclick="openTrackModal(event,\''+o.id+'\')">★ See All Updates</span></div>' : ''}
          </div>
        </div>
      `).join('')}
    </div>`;
  }).join('');
}

// ── Filters ──────────────────────────────────────────────────────
function applyFilters() {
  const search = document.getElementById('search-orders').value.trim().toLowerCase();
  const statuses = [...document.querySelectorAll('.filter-sidebar input[type=checkbox]:checked')].map(c => c.value);
  const timeFilters = [...document.querySelectorAll('.filter-sidebar input[type=checkbox]:checked')].map(c => c.value);

  const statusVals = statuses.filter(v => !['30days','2026','2025','older'].includes(v));
  const timeVals = statuses.filter(v => ['30days','2026','2025','older'].includes(v));

  let filtered = allOrders;

  if (statusVals.length) {
    const flatStatus = statusVals.flatMap(v => v.split(','));
    filtered = filtered.filter(o => flatStatus.some(s => o.status === s ||
      (s === 'on_way' && ['shipped','out_for_delivery','confirmed','processing'].includes(o.status))));
  }

  if (timeVals.length) {
    const now = new Date();
    filtered = filtered.filter(o => {
      const d = new Date(o.createdAt);
      return timeVals.some(tv => {
        if (tv === '30days') return (now - d) <= 30 * 86400000;
        if (tv === '2026') return d.getFullYear() === 2026;
        if (tv === '2025') return d.getFullYear() === 2025;
        if (tv === 'older') return d.getFullYear() < 2025;
        return true;
      });
    });
  }

  if (search) {
    filtered = filtered.filter(o => {
      const itemText = (o.items || []).map(i => `${i.name||''} ${i.brand||''} ${i.model||''}`).join(' ').toLowerCase();
      return (o.orderNumber||'').toLowerCase().includes(search) || itemText.includes(search);
    });
  }

  renderOrders(filtered);
}

function openFilterSidebar(){
  document.getElementById('filter-sidebar').classList.add('open');
  document.getElementById('filter-overlay').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeFilterSidebar(){
  document.getElementById('filter-sidebar').classList.remove('open');
  document.getElementById('filter-overlay').classList.remove('open');
  document.body.style.overflow='';
}

function clearFilters() {
  document.querySelectorAll('.filter-sidebar input[type=checkbox]').forEach(c => c.checked = false);
  document.getElementById('search-orders').value = '';
  renderOrders(allOrders);
}

// ── Track Modal ──────────────────────────────────────────────────
let ordersById = {};

function openTrackModal(e, orderId) {
  e.stopPropagation();
  const o = ordersById[orderId];
  if (!o) return;

  document.getElementById('track-title').textContent = 'Track Package — ' + (o.orderNumber || o.id);

  const items = o.items || [];
  const item = items[0] || {};
  document.getElementById('track-product-row').innerHTML = `
    <div style="width:72px;height:56px;display:flex;align-items:center;justify-content:center;background:#f8f9fa;border-radius:3px;flex-shrink:0;">
      ${item.imageUrl ? `<img class="track-product-img" src="${item.imageUrl}" onerror="this.src='images/laptop-placeholder.svg'">` : '<span style="font-size:28px;">💻</span>'}
    </div>
    <div>
      <div class="track-product-name">${item.name || item.model || ('Order ' + (o.orderNumber || o.id))}</div>
      <div class="track-product-specs">${[item.brand, item.processor, item.ram].filter(Boolean).join(' · ')}</div>
      <div style="font-size:13px;font-weight:700;margin-top:4px;">₹${(item.price||o.amount||0).toLocaleString('en-IN')}</div>
    </div>`;

  const trackEl = document.getElementById('track-id-row');
  if (o.trackingId) {
    trackEl.style.display = 'flex';
    document.getElementById('track-id-text').textContent = `Tracking ID: ${o.trackingId}`;
  } else {
    trackEl.style.display = 'none';
  }

  const steps = buildTimeline(o);
  document.getElementById('track-timeline').innerHTML = steps.map(s => `
    <div class="timeline-step ${s.done ? 'done' : ''} ${s.active ? 'active' : ''}">
      <div class="tl-dot ${s.done ? 'done' : s.active ? 'active' : ''}"></div>
      <div class="tl-title ${s.done ? 'tl-step-done' : ''}" style="${s.active && !s.done ? 'color:#2874f0;' : ''}">${s.title}</div>
      ${s.date ? `<div class="tl-date">${s.date}</div>` : ''}
      ${s.sub ? s.sub.map(l => `<div class="tl-sub">${l}</div>`).join('') : ''}
    </div>
  `).join('');

  document.getElementById('track-modal').classList.add('open');
}

function buildTimeline(o) {
  const statusOrder = ['pending','confirmed','processing','shipped','out_for_delivery','delivered'];
  const currentIdx = statusOrder.indexOf(o.status);
  const cancelled = o.status === 'cancelled';
  const returned = ['return_requested','returned'].includes(o.status);

  const steps = [
    { title: 'Order Confirmed', date: fmtDate(o.createdAt), sub: ['Your order has been placed.', o.createdAt ? new Date(o.createdAt).toLocaleString('en-IN',{hour:'2-digit',minute:'2-digit'}) : ''], done: currentIdx >= 0 && !cancelled },
    { title: 'Shipped', date: fmtDate(o.shippedAt), sub: o.trackingId ? [`${o.carrier || 'Courier'} — ${o.trackingId}`, 'Your item has been shipped.'] : ['Your item will be shipped soon.'], done: currentIdx >= 3 && !cancelled },
    { title: 'Out for Delivery', date: fmtDate(o.outForDeliveryAt), sub: ['Your item is out for delivery.'], done: currentIdx >= 4 && !cancelled },
    { title: 'Delivered', date: fmtDate(o.deliveredAt), sub: ['Your item has been delivered.'], done: o.status === 'delivered' },
  ];

  if (cancelled) {
    steps[0].done = true;
    steps.push({ title: 'Cancelled', date: fmtDate(o.updatedAt || o.createdAt), sub: [o.cancelReason || 'Order was cancelled.'], done: true, active: true });
  } else if (returned || o.status === 'return_requested') {
    steps.forEach(s => s.done = true);
    steps.push({ title: 'Return Requested', date: fmtDate(o.updatedAt), sub: ['Your return request is being processed.'], done: o.status === 'returned', active: o.status === 'return_requested' });
    if (o.status === 'returned') steps.push({ title: 'Refund Processed', date: fmtDate(o.refundedAt), sub: ['Amount will be credited within 5–7 working days.'], done: true });
  } else {
    // Mark active step
    const activeIdx = currentIdx >= 0 ? currentIdx : 0;
    const stepsIdxMap = [0, 0, 0, 1, 2, 3]; // pending→0, confirmed→0, processing→0, shipped→1...
    const activeStep = stepsIdxMap[activeIdx] ?? 0;
    if (activeStep < steps.length) steps[activeStep].active = true;
  }

  return steps;
}

function closeTrackModal() {
  document.getElementById('track-modal').classList.remove('open');
}
document.getElementById('track-modal').addEventListener('click', e => { if (e.target === e.currentTarget) closeTrackModal(); });

// ── Cancel / Return ───────────────────────────────────────────────
async function cancelOrder(id) {
  if (!confirm('Cancel this order?')) return;
  try {
    await apiFetch(`/orders/${id}/cancel`, { method: 'POST' });
    alert('Order cancelled.');
    loadOrders();
  } catch(e) { alert('Could not cancel: ' + e.message); }
}
async function requestReturn(id) {
  if (!confirm('Request a return for this order?')) return;
  try {
    await apiFetch(`/orders/${id}/return`, { method: 'POST' });
    alert('Return request submitted.');
    loadOrders();
  } catch(e) { alert('Could not submit return: ' + e.message); }
}

// ── Load ─────────────────────────────────────────────────────────
async function loadOrders() {
  const el = document.getElementById('orders-list');
  try {
    const orders = await apiFetch('/orders');
    allOrders = orders || [];
    ordersById = {};
    allOrders.forEach(o => ordersById[o.id] = o);
    renderOrders(allOrders);
  } catch(e) {
    el.innerHTML = `<div class="empty-state">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
      <p>Error loading orders</p><small>${e.message}</small></div>`;
  }
}
loadOrders();
(function(){
  const ref = new URLSearchParams(location.search).get('placed');
  const list = document.getElementById('orders-list');
  if (!ref || !list) return;
  const b = document.createElement('div');
  b.style.cssText = 'background:#e8f5e9;color:#1b5e20;border:1px solid #a5d6a7;border-radius:6px;padding:12px 16px;margin-bottom:12px;font-weight:600;font-size:14px;';
  b.textContent = '✓ Order placed successfully! Reference: ' + ref + '. You can track it below.';
  list.parentNode.insertBefore(b, list);
})();
</script>
