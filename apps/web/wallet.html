<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Wallet — dbuggs</title>
<meta name="description" content="Your dbuggs wallet — refunds, trade-in credits, and transaction history.">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:#f1f3f6;color:#212121;font-size:14px;}
a{text-decoration:none;color:inherit;}
.header{background:#2874f0;padding:10px 20px;position:sticky;top:0;z-index:100;box-shadow:0 2px 4px rgba(0,0,0,.2);}
.header-inner{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:16px;}
.logo{font-size:20px;font-weight:700;color:#fff;}.logo span{color:#ffe500;}
.header-actions{margin-left:auto;display:flex;gap:10px;}
.hbtn{padding:8px 16px;border-radius:3px;font-size:13px;font-weight:600;cursor:pointer;border:none;font-family:inherit;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.4);}

.page{max-width:900px;margin:20px auto;padding:0 20px;}
h1{font-size:22px;font-weight:700;margin-bottom:20px;}

.balance-card{background:linear-gradient(135deg,#2874f0,#1a5dc8);color:#fff;border-radius:12px;padding:28px;margin-bottom:24px;display:flex;align-items:center;justify-content:space-between;gap:20px;}
.balance-card .label{font-size:14px;opacity:.85;}
.balance-card .amt{font-size:36px;font-weight:700;margin-top:4px;}
.balance-card .info{font-size:12.5px;opacity:.7;max-width:240px;text-align:right;}

.section-head{font-size:16px;font-weight:700;margin-bottom:12px;}
.txn-table{width:100%;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.08);}
.txn-table th,.txn-table td{padding:12px 16px;text-align:left;border-bottom:1px solid #f0f0f0;font-size:13px;}
.txn-table th{background:#f8f9fb;font-weight:600;color:#878787;}
.credit{color:#2e7d32;font-weight:700;}
.debit{color:#c62828;font-weight:700;}
.empty{text-align:center;padding:40px;color:#878787;}

@media(max-width:600px){.balance-card{flex-direction:column;text-align:center;}.balance-card .info{text-align:center;max-width:100%;}}
</style>
</head>
<body>
<div class="header"><div class="header-inner"><a href="/" class="logo">dbugg<span>s</span></a><div class="header-actions"><a href="/orders.html" class="hbtn">My Orders</a><a href="/cart.html" class="hbtn">Cart</a></div></div></div>

<div class="page">
<h1>My Wallet</h1>

<div class="balance-card">
  <div><div class="label">Available Balance</div><div class="amt" id="balance">₹0</div></div>
  <div class="info">Refunds and trade-in credits are added to your wallet automatically. Use wallet balance at checkout.</div>
</div>

<div class="section-head">Transaction History</div>
<div class="txn-table">
  <table style="width:100%;border-collapse:collapse;">
    <thead><tr><th>Date</th><th>Type</th><th>Amount</th><th>Balance</th><th>Note</th></tr></thead>
    <tbody id="txnBody"></tbody>
  </table>
  <div id="empty" class="empty" style="display:none;">No transactions yet. Refunds and trade-in credits will appear here.</div>
</div>
</div>

<script src="/shop-api.js"></script>
<script>
async function load(){
  if(!getToken()){
    document.querySelector('.page').innerHTML='<div class="empty"><h2>Please login first</h2><p><a href="/login.html" style="color:#2874f0;font-weight:600;">Login</a> to view your wallet.</p></div>';
    return;
  }
  try{
    const data=await apiFetch('/orders/wallet/balance');
    document.getElementById('balance').textContent='₹'+Number(data.balance||0).toLocaleString('en-IN');
    const txns=data.transactions||[];
    if(!txns.length){document.getElementById('empty').style.display='';return;}
    document.getElementById('txnBody').innerHTML=txns.map(t=>{
      const date=new Date(t.createdAt).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
      const cls=t.type==='credit'?'credit':'debit';
      const sign=t.type==='credit'?'+':'−';
      return `<tr><td>${date}</td><td style="text-transform:capitalize">${t.type}</td><td class="${cls}">${sign}₹${Number(t.amount).toLocaleString('en-IN')}</td><td>₹${Number(t.balanceAfter).toLocaleString('en-IN')}</td><td>${t.note||'—'}</td></tr>`;
    }).join('');
  }catch(e){console.error(e);document.getElementById('empty').style.display='';document.getElementById('empty').textContent='Could not load wallet data.';}
}
load();
</script>
</body>
</html>
